[pytest]
# Pytest configuration for Customer CRM Backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for API endpoints
    database: Tests that interact with the database
    hierarchy: Tests for hierarchical relationship features

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage options (if pytest-cov is installed)
# Uncomment these lines after installing: pip install pytest-cov
# addopts = 
#     --cov=app
#     --cov-report=html
#     --cov-report=term-missing

# Test paths
testpaths = .

# Minimum Python version
minversion = 3.8
